<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #6b6f7d; letter-spacing: 1px; }
      .prompt { font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; fill: #3ddc84; }
      .heading { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 30px; fill: #f2f3f5; }
      .comment { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; fill: #6b6f7d; }
      .field-key { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; fill: #3ddc84; }
      .field-val { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; fill: #d7d9e0; }
      .hex { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #3a3d4a; }
      .tag { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #0d0e13; font-weight:700;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="400" rx="10" fill="#0d0e13"/>
  <rect x="1" y="1" width="1198" height="398" rx="9" fill="none" stroke="#22242e" stroke-width="1.5"/>

  <text x="640" y="60" class="hex" text-anchor="middle">25 50 44 46 2D 31 2E 34 0A 89 50 4E 47 0D 0A 1A 0A 50 4B 03 04 14 00</text>
  <text x="640" y="380" class="hex" text-anchor="middle">7F 45 4C 46 02 01 01 00 00 00 4D 5A 90 00 03 00 00 00 04 00 00 00</text>

  <rect x="0" y="0" width="1200" height="38" rx="10" fill="#161822"/>
  <rect x="0" y="28" width="1200" height="10" fill="#161822"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="600" y="24" text-anchor="middle" class="win-title">forensics-lab — file-signature-identifier — bash</text>

  <text x="48" y="88" class="prompt">$ ./identify --project</text>
  <text x="48" y="130" class="heading">File Signature Identifier</text>
  <text x="48" y="156" class="comment"># True file-type detection &amp; spoofing analysis via magic numbers</text>

  <line x1="48" y1="178" x2="1152" y2="178" stroke="#22242e" stroke-width="1"/>

  <text x="48" y="212" class="field-key">problem   →</text>
  <text x="180" y="212" class="field-val">Extensions lie; attackers rename malicious binaries to trusted document formats to bypass basic filt</text>

  <text x="48" y="242" class="field-key">method    →</text>
  <text x="180" y="242" class="field-val">Parses raw binary headers in-memory, validates magic numbers, flags spoof mismatches, renders hex du</text>

  <text x="48" y="272" class="field-key">stack     →</text>
  <text x="180" y="272" class="field-val">react · Vite · Python FastAPI · In-Memory Binary Parser</text>

  <text x="48" y="302" class="field-key">status    →</text>
  <text x="180" y="302" class="field-val" fill="#3ddc84">Live at https://file-sign-identifier.ver</text>
  <rect x="1080" y="288" width="16" height="16" fill="#3ddc84" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(0, 330)">
    <rect x="48" y="0" width="135.8" height="26" rx="4" fill="#3ddc84"/>
    <text x="115.9" y="17" text-anchor="middle" class="tag">MAGIC NUMBERS</text>
    <rect x="195.8" y="0" width="153" height="26" rx="4" fill="#f5a623"/>
    <text x="272.3" y="17" text-anchor="middle" class="tag">SPOOF DETECTION</text>
    <rect x="360.8" y="0" width="110" height="26" rx="4" fill="#6ea8fe"/>
    <text x="415.8" y="17" text-anchor="middle" class="tag">HEX VIEWER</text></g>
</svg>